<svg xmlns="http://www.w3.org/2000/svg" width="960" height="437" viewBox="0 0 960 437" role="img" aria-labelledby="title description">
  <title id="title">Wordle CLI session, seed 42</title>
  <desc id="description">Actual terminal output showing SLATE followed by MIXED, solving the seeded puzzle in two attempts. Keyboard redraws are omitted from this excerpt.</desc>
  <rect width="960" height="437" rx="8" fill="#13171D"/>
  <path d="M0 8Q0 0 8 0H952Q960 0 960 8V46H0Z" fill="#252B35"/>
  <text x="24" y="29" fill="#CCD5E0" font-family="Arial, sans-serif" font-size="16">word-games-cli · Wordle · seed 42</text>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="18">
    <text x="24" y="83" fill="#B8D8BC">$ cargo run --release --locked -p word-games-cli -- wordle --seed 42 --color always</text>
    <text x="24" y="150" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">Guess the 5-letter secret word in 6 valid attempts.</tspan></text><text x="24" y="182" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">Feedback: </tspan><tspan fill="#A7D7A5" font-weight="400">C / Green</tspan><tspan fill="#E6EDF3" font-weight="400"> = Correct, </tspan><tspan fill="#F3CB82" font-weight="400">P / Yellow</tspan><tspan fill="#E6EDF3" font-weight="400"> = Present, </tspan><tspan fill="#98A2B1" font-weight="400">. / Gray</tspan><tspan fill="#E6EDF3" font-weight="400"> = Absent</tspan></text><text x="24" y="214" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">[Attempt </tspan><tspan fill="#8DD4C5" font-weight="400">1</tspan><tspan fill="#E6EDF3" font-weight="400">/6] Enter 5-letter guess: SLATE</tspan></text><text x="24" y="246" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">  [1/6]  </tspan><tspan fill="#98A2B1" font-weight="400"> S </tspan><tspan fill="#98A2B1" font-weight="400"> L </tspan><tspan fill="#98A2B1" font-weight="400"> A </tspan><tspan fill="#98A2B1" font-weight="400"> T </tspan><tspan fill="#F3CB82" font-weight="700"> E </tspan><tspan fill="#E6EDF3" font-weight="400">   [....P]</tspan></text><text x="24" y="278" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">[Attempt </tspan><tspan fill="#8DD4C5" font-weight="400">2</tspan><tspan fill="#E6EDF3" font-weight="400">/6] Enter 5-letter guess: MIXED</tspan></text><text x="24" y="310" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">  [2/6]  </tspan><tspan fill="#A7D7A5" font-weight="700"> M </tspan><tspan fill="#A7D7A5" font-weight="700"> I </tspan><tspan fill="#A7D7A5" font-weight="700"> X </tspan><tspan fill="#A7D7A5" font-weight="700"> E </tspan><tspan fill="#A7D7A5" font-weight="700"> D </tspan><tspan fill="#E6EDF3" font-weight="400">   [CCCCC]</tspan></text><text x="24" y="342" xml:space="preserve"><tspan fill="#A7D7A5" font-weight="700">                 VICTORY!               </tspan></text><text x="24" y="374" xml:space="preserve"><tspan fill="#E6EDF3" font-weight="400">Magnificent! Solved the puzzle in </tspan><tspan fill="#A7D7A5" font-weight="700">2</tspan><tspan fill="#E6EDF3" font-weight="400">/6 attempts!</tspan></text>
  </g>
  <text x="24" y="415" fill="#98A2B1" font-family="Arial, sans-serif" font-size="15">Session excerpt · full transcript in docs/demos/wordle.txt</text>
</svg>
